name: Run NanEcho Tests and Server

on:
  push:
    branches: [ main, master ]
    paths:
      - 'NanEcho/**'
      - 'echoself.md'
      - 'echo/**'
      - '.github/workflows/nerun.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'NanEcho/**'
      - 'echoself.md'
      - 'echo/**'
      - '.github/workflows/nerun.yml'
  workflow_run:
    workflows: ["Train NanEcho Model"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      deploy_server:
        description: 'Deploy server after tests'
        required: false
        default: false
        type: boolean
      port:
        description: 'Server port'
        required: false
        default: '8081'
        type: string
      model_artifact:
        description: 'Model artifact name (leave empty for latest)'
        required: false
        default: ''
        type: string
      echo_mode:
        description: 'Enable Echo Self introspection mode'
        required: false
        default: true
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
    - name: Checkout echoself repository
      uses: actions/checkout@v4
      with:
        path: echoself

    - name: Checkout nanoGPT
      uses: actions/checkout@v4
      with:
        repository: drzo/nanoGPT
        path: nanoGPT

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Free up disk space
      run: |
        echo "Disk space before cleanup:"
        df -h
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo apt-get clean
        echo "Disk space after cleanup:"
        df -h

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir torch numpy tiktoken transformers requests fastapi uvicorn rich pytest pytest-asyncio httpx pytest-cov
        pip install --no-cache-dir markdown beautifulsoup4 pyyaml

    - name: Determine model artifact name
      id: model
      run: |
        if [[ -n "${{ github.event.inputs.model_artifact }}" ]]; then
          echo "artifact_name=${{ github.event.inputs.model_artifact }}" >> $GITHUB_OUTPUT
        else
          echo "artifact_name=nanecho-model-out-nanecho-ci" >> $GITHUB_OUTPUT
        fi

    - name: Download nanecho model artifact
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: netrain.yml
        name: ${{ steps.model.outputs.artifact_name }}
        path: nanoGPT/out-nanecho-ci
        if_no_artifact_found: warn

    - name: Check for nanecho model checkpoint
      id: checkpoint
      run: |
        if [ -f nanoGPT/out-nanecho-ci/ckpt.pt ]; then
          echo "Found model checkpoint: nanoGPT/out-nanecho-ci/ckpt.pt"
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "No trained nanecho model artifact found; model-dependent steps will be reported as not run."
          echo "available=false" >> $GITHUB_OUTPUT
        fi

    - name: Prepare directory structure
      run: |
        # Create necessary directories
        mkdir -p echoself/NanEcho/data
        mkdir -p echoself/NanEcho/tests/nanecho
        mkdir -p echoself/NanEcho/introspection
        mkdir -p echoself/NanEcho/evaluation
        
        # Make sure nanoGPT can find the echoself repo
        ln -s $(pwd)/echoself $(pwd)/nanoGPT/echoself
        
        # Create nanecho test directory structure
        touch echoself/NanEcho/tests/nanecho/__init__.py

    - name: Run basic Echo Self tests
      run: |
        cd echoself
        python -c "
        import sys
        import os
        sys.path.insert(0, os.path.abspath('NanEcho'))
        
        # Echo Self client imports (it talks to a running neserver; nothing is queried here)
        from introspection.echo_client import EchoSelfClient
        print('Echo Self client imported')
        
        # Echo Self configuration
        from config.train_nanecho import CONFIG
        print(f'Echo Self config loaded: {len(CONFIG[\"echo_self\"][\"learning_phases\"])} phases')
        
        # Model wrapper imports
        from netalk import EchoModelConfig
        print('Echo Self model config imported')
        "

    - name: Test NanEcho model loading and generation
      run: |
        cd echoself
        if [ "${{ steps.checkpoint.outputs.available }}" != "true" ]; then
          echo "SKIPPED: no model checkpoint available, model loading/generation not tested."
          exit 0
        fi
        python -c "
        import sys
        import os
        sys.path.insert(0, os.path.abspath('NanEcho'))
        from netalk import EchoModelConfig
        
        config = EchoModelConfig('../nanoGPT/out-nanecho-ci/ckpt.pt')
        config.load_model()
        print(f'Loaded checkpoint: iter={config.model_info[\"iter_num\"]}, best_val_loss={config.model_info[\"best_val_loss\"]}')
        text, n = config.complete('User: What is Echo Self?\nEcho: ', max_new_tokens=40)
        print(f'Generated {n} tokens:')
        print(text)
        "

    - name: Run Echo Self evaluation
      run: |
        cd echoself/NanEcho
        if [ "${{ steps.checkpoint.outputs.available }}" != "true" ]; then
          echo "SKIPPED: no model checkpoint available, Echo Self fidelity NOT evaluated."
          python -c "
        import json, time
        json.dump({
            'status': 'not_evaluated',
            'reason': 'No trained model checkpoint artifact was available',
            'evaluation_timestamp': time.time()
        }, open('echo_fidelity_report.json', 'w'), indent=2)
        "
          exit 0
        fi
        python evaluation/echo_fidelity.py \
          --model_path=../../nanoGPT/out-nanecho-ci/ckpt.pt \
          --output_path=echo_fidelity_report.json

    - name: Test server components
      run: |
        cd echoself/NanEcho
        # Test server imports
        python -c "
        import sys
        import os
        
        from neserver import app
        print('NanEcho server imports successfully')
        "

    - name: Deploy Echo Self server (if requested)
      if: ${{ github.event.inputs.deploy_server == 'true' }}
      run: |
        cd echoself
        echo "Server deployment is not implemented in this workflow; nothing was deployed."
        echo "Requested model: ../nanoGPT/out-nanecho-ci/ckpt.pt"
        echo "Requested port: ${{ github.event.inputs.port }}"
        echo "To run it: python NanEcho/neserver.py --model_path ../nanoGPT/out-nanecho-ci/ckpt.pt --port ${{ github.event.inputs.port }}"

    - name: Upload Echo Self evaluation report
      uses: actions/upload-artifact@v4
      with:
        name: nanecho-evaluation-report
        path: echoself/NanEcho/echo_fidelity_report.json
        retention-days: 30

    - name: Show disk usage on failure
      if: failure()
      run: |
        echo "=== Disk usage diagnostics ==="
        df -h
        echo "=== Largest directories ==="
        du -sh /home/runner/* 2>/dev/null | sort -rh | head -10 || true